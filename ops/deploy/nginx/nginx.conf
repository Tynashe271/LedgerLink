# BranchLedger reverse proxy. Matches BranchLedger_Architecture.pdf
# ("Deployment and data paths", "Host a TLS reverse proxy, Laravel process,
# Go API, workers and database in separated deployment units") and the
# Version 1.1 launch safeguards addendum's "Go and Laravel implementation
# ownership" section: terminate TLS, redirect HTTP to HTTPS, apply reviewed
# HSTS, limit request bodies and headers, disable directory listing, deny
# private paths. HSTS is delivered on HTTPS responses only.
#
# Nginx's only job is TLS termination and forwarding everything to Laravel —
# it does not reach the Go API directly. Laravel is the same-origin API
# gateway: it owns the session/CSRF check and signs the delegated-identity
# token before calling Go (architecture: "Browser requests use the same
# HTTPS origin. Laravel routes /api requests through an authenticated
# gateway to Go").

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Launch control #15 / #34: bound request bodies so an oversized upload
    # fails before unbounded buffering. 12M covers the architecture's 10 MiB
    # attachment default plus multipart overhead; Laravel enforces the exact
    # business limit independently.
    client_max_body_size 12m;
    large_client_header_buffers 4 16k;

    # Launch control #36: no directory listing, no serving dotfiles/private paths.
    autoindex off;

    server {
        listen 80;
        server_name branchledger.local;
        # Neither $host nor $http_host carries the right port here: nginx
        # runs inside the container on plain 80/443, with no visibility into
        # Podman's dev-only host-side remap (-p 8180:80, -p 8443:443,
        # dev-up.sh). $host alone redirected to https://<host>/ — the
        # default port 443, where nothing is listening on the host — so the
        # dev HTTPS front door is pinned explicitly. A real deployment with
        # unmapped 80/443 would drop the ":8443" and use $host alone.
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name branchledger.local;

        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Launch control #26: HSTS only once HTTPS is confirmed working on
        # every affected host — left commented for local self-signed dev;
        # uncomment (and set preload/includeSubDomains deliberately) once a
        # real certificate and domain are in place.
        # add_header Strict-Transport-Security "max-age=63072000" always;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        location ~ /\. {
            deny all;
        }

        # Laravel's own public/ entry point handles both the Blade web UI
        # and the /api/* gateway routes — nginx forwards everything to it
        # and never talks to the Go API or Postgres directly.
        location / {
            # In this local dev topology Laravel runs natively on the Windows
            # host (php artisan serve), reached from the podman VM via
            # host.containers.internal. In a fully containerized deployment
            # this becomes an internal service name, e.g. laravel-app:8000.
            proxy_pass http://host.containers.internal:8000;
            proxy_http_version 1.1;
            # $http_host (not $host): $host silently strips a non-default
            # port, so on a dev front door like :8443 Laravel would build
            # redirect/absolute URLs back to the default port (443) where
            # nothing is listening. $http_host preserves whatever the client
            # actually sent (host[:port]).
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Deliberately not forwarding any client-supplied identity
            # header; Laravel derives identity from its own verified
            # session, never from a request header.
        }
    }
}
